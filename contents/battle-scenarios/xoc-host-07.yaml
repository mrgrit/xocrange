description: '새 수신 포트와 포트 탐색 흔적이 이어졌다. Red는 제한된 포트 관측을 만들고 Blue는 도구 실행·리스너·외부 도달성을 나눠 확인한다.


  포트가 LISTEN 상태라는 사실과 외부에서 접근할 수 있다는 사실은 다르다. nftables 드롭은 접근 정책 결과이며 특정 프로세스의 악성 여부를 뜻하지 않는다.


  진행: Red 공격 재현 → Blue 관측·대응 설계 → Purple 분석·인계. 각 미션은 학습자 시도·시스템 반응·학습자의 해석을 함께 등록하며, 총 100점입니다.'
