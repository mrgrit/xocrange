- id: xoc-host-07-red-02
  order: 2
  title: RED · 지정 포트 세 개만 관측
  learning_role: red
  target_vm: web
  assess_target: opponent
  points: 15
  instruction: '## RED · 지정 포트 세 개만 관측


    ### 이번 미션에서 할 일

    외부 공격자에서 한 실습 대상의 지정 포트만 관측한다. 루프백 리스너는 외부에서 열려 있지 않을 수 있다.


    ### 따라 하기

    1. 외부 공격자 VM {{ATTACKER_IP}}의 터미널을 엽니다.

    2. 교관 준비 항목의 실습 계정·권한·초기 상태를 확인합니다. SSH/스캔 미션은 교관이 지정한 전용 실습 Linux 주소를 `export XOC_LINUX_IP=실습주소`로 설정합니다. TARGET_IP는 관리/Assessor
    주소이므로 대신 사용하지 않습니다.

    3. 아래 명령을 한 번 수행합니다.


    ```bash

    nmap -sT -Pn -p 22,80,54015 --max-retries 1 --host-timeout 20s ${XOC_LINUX_IP:?set_assigned_training_linux_ip}

    ```

    4. 화면에 실제 결과가 나왔는지 확인한 뒤, 실행한 명령과 시도 과정을 학습자 시도에, 실제 출력과 오류를 시스템 반응에 기록합니다. 결과가 예시와 다르면 명령을 반복해 결과를 꾸미지 말고 교관과 환경을 확인합니다.


    ### 세 항목으로 기록하기

    1. **학습자 시도** — 실제로 사용한 명령, 대상·태그·시각, 재시도와 오류 해결 과정을 적으세요.

    2. **시스템 반응** — 실제 출력·오류·검색 결과·원본 로그와 필요한 캡처를 모두 기록하세요. 시각·대상·표식과 출처를 함께 남기고, 결과가 없으면 확인한 범위와 수집 상태를 적으세요.

    3. **학습자의 해석** — 관측 결과가 이번 미션에서 무엇을 뜻하는지 근거와 함께 설명하세요. 확인한 사실, 아직 확인하지 못한 범위, 다음 확인·대응을 구분하세요.


    작성 중에는 자동으로 임시 저장됩니다. 세 항목을 확인한 뒤 **미션 등록**을 누르세요. 여러 번 시도했다면 그 과정과 결과를 모두 남겨도 됩니다.


    ### 배점

    15점 — 시도 6점, 반응·근거 5점, 해석 4점.

    '
