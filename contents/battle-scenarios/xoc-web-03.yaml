- id: xoc-web-03-purple-02
  order: 5
  title: PURPLE · 다음 담당자에게 사건 넘기기
  learning_role: purple
  target_vm: siem
  assess_target: self
  points: 10
  instruction: |
    ## PURPLE · 다음 담당자에게 사건 넘기기

    ### 이번 미션에서 할 일
    다음 담당자가 관측한 사실과 후속 조치를 이해할 수 있도록 짧은 인계 보고를 작성합니다.

    ### 따라 하기
    1. 이번 사건의 실제 태그·대상·시간을 확인합니다. 비밀번호와 개인키는 포함하지 않습니다.
    2. 확인한 사실 다음에 필요한 조치와 정상 기능 확인 항목을 이어 씁니다.
    3. 하나의 짧은 문단으로 제출합니다. 이전 미션 답을 항목별로 다시 입력하지 않습니다.

    ### 제출은 하나
    **인계 보고 하나만** 아래 입력칸에 제출하세요. 출력·해석을 별도 칸에 다시 적지 않습니다.

    ### 배점
    10점 — 내용 6점, 대상·근거 일치 4점.
  hint: 하나의 짧은 문단으로 제출합니다. 이전 미션 답을 항목별로 다시 입력하지 않습니다.
  submission:
    type: text
    fields: 1
    label: 인계 보고
    max_length: 12000
    placeholder: 관측 사실과 다음 조치를 한 단락으로 적으세요.
  reference_answer:
    answer: 스크립트 입력을 해당 거래의 차단 이벤트와 연결했다. 출력 문맥별 인코딩을 적용하고 정상 검색과 인코딩된 출력 표시를 확인한다.
    explanation: WAF가 스크립트 입력을 탐지하고 차단했다. 응답 DOM이나 브라우저 실행 증거는 제공되지 않았다.
    equivalents:
