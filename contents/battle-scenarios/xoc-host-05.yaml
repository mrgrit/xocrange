  - kind: partial
    submission: 관련 이벤트를 찾았지만 대상과 시각의 연결은 확인하지 못했습니다.
    expected_score_range:
    - 0
    - 10
  verify:
    type: wazuh_alert
    expect: xoc-lf-h05
    checks:
