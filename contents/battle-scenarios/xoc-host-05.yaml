instructor_setup:
  required:
  - 할당된 훈련 인프라를 깨끗한 스냅샷으로 시작하고 종료 후 복원
  - tw2 target/attacker 인프라와 Assessor 연결, 시각 동기화
  - Wazuh native 경보와 원본 접근, 학습자별 대상 필터
  - 한 배틀에 고유한 학습자 태그 및 실행 시각 기록
  - xoc-student 실습 계정과 지정된 권한·초기 파일 상태
  - Sysmon 프로세스 및 auditd 파일/명령 관측을 실습 경로에 설정
  - XOC_LINUX_IP를 Blue 대상 web 실습 Linux의 SSH/관측 주소에 바인딩. 관리/Assessor 호스트 주소와 분리
  - 실습 Linux의 로그가 Blue 대상 Assessor web/siem에 연결됨을 확인. 1v1 Red에는 해당 실습 Linux의 초기 접근 계정만 발급
  execution_status: 실습 인프라에서 교관이 사전 재현한 후 학생 실행을 연다. 이번 패키지는 채점 계약과 학습 콘텐츠이며 Core에서 실행하지 않는다.
  cleanup: 배틀 스냅샷 복원. 스냅샷 없이 진행했다면 해당 시나리오가 만든 계정·키·/tmp 파일·주석·리스너만 변경 기록과 지문을 확인해 제거한다. 기존 자료는 보존한다.
red_missions:
- id: xoc-host-05-red-01
  order: 1
  title: RED · 실습 사용자 cron 표식 등록
  learning_role: red
  target_vm: web
  assess_target: opponent
  points: 20
  instruction: |
    ## RED · 실습 사용자 cron 표식 등록

    ### 이번 미션에서 할 일
    현재 사용자의 crontab에 주석 표식만 추가한다. 실행 예약은 만들지 않는다. 탐지 과정은 파일 변경이며 실제 지속 실행은 별도 사건 자료로 분석한다.

    ### 따라 하기
    1. Blue 대상 인프라에 할당된 web 실습 Linux 터미널(교관이 발급한 Red 초기 접근 계정)을 엽니다.
    2. 교관 준비 항목의 실습 계정·권한·초기 상태를 확인합니다. SSH/스캔 미션은 교관이 지정한 전용 실습 Linux 주소를 `export XOC_LINUX_IP=실습주소`로 설정합니다. TARGET_IP는 관리/Assessor 주소이므로 대신 사용하지 않습니다.
    3. 아래 명령을 한 번 수행합니다.

    ```bash
    (crontab -l 2>/dev/null; printf '%s\n' '# xoc-lf-h05 training marker') | crontab -
    ```
    4. 화면에 실제 결과가 나왔는지 확인한 뒤, 제출칸에는 실행한 명령만 붙여넣습니다. 결과가 예시와 다르면 명령을 반복해 결과를 꾸미지 말고 교관과 환경을 확인합니다.

    ### 제출은 하나
    **명령 하나만** 아래 입력칸에 제출하세요. 출력·해석을 별도 칸에 다시 적지 않습니다.

    ### 배점
    20점 — 내용 12점, 대상·근거 일치 8점.
  hint: 화면에 실제 결과가 나왔는지 확인한 뒤, 제출칸에는 실행한 명령만 붙여넣습니다. 결과가 예시와 다르면 명령을 반복해 결과를 꾸미지 말고 교관과 환경을 확인합니다.
  submission:
    type: text
    fields: 1
    label: 명령
    max_length: 12000
    placeholder: 실행한 명령 한 개를 붙여넣으세요.
  reference_answer:
    answer: (crontab -l 2>/dev/null; printf '%s\n' '# xoc-lf-h05 training marker') | crontab -
    explanation: 현재 사용자의 crontab에 주석 표식만 추가한다. 실행 예약은 만들지 않는다. 탐지 과정은 파일 변경이며 실제 지속 실행은 별도 사건 자료로 분석한다.
    equivalents:
    - 의미가 같으면 띄어쓰기·명령 옵션 순서·동등한 DQL 괄호·한국어 표현 차이를 허용한다. 단 대상, 시간 범위, 증거와 결론은 일치해야 한다.
    common_errors:
    - 교재의 예시를 자신의 관측 결과로 제출
    - 단순 키워드 포함만으로 성공 주장
    - 로그 부재를 무사고 또는 차단 성공으로 판단
  rubric:
  - id: meaning
    points: 12
    description: 제출한 명령이 이번 미션의 대상과 요구 의미를 충족한다.
    full_credit: (crontab -l 2>/dev/null; printf '%s\n' '# xoc-lf-h05 training marker') | crontab -
    partial_credit: 대상은 맞지만 필요한 제한 조건 또는 핵심 구별 중 일부가 빠졌다.
    zero_credit: 미션과 다른 대상·행위를 제출했거나 증거와 반대 결론이다.
    partial_points: 6
  - id: grounding
    points: 8
    description: 관측 또는 미션 조건에 맞게 범위를 한정한다.
    full_credit: 실제 배틀의 시간·대상·표식에 대응하며 확인하지 않은 실행·차단·탈취를 주장하지 않는다.
    partial_credit: 핵심 의미는 맞지만 시간·대상 연결이 불완전하다.
    zero_credit: 다른 사람의 자료, 교재의 예시값 또는 문구 복사를 실제 결과처럼 제출한다.
    partial_points: 4
  evaluation_cases:
  - kind: full
