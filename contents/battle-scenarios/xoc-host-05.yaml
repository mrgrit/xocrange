title: 예약 작업과 다운로드 실행 연결
description: |-
  임시 경로 파일과 사용자 cron 항목이 발견됐다. Red는 동작이 없는 예약 표식과 무해한 진단 스크립트를 사용하고 Blue는 지속성·실행 흐름을 구분한다.

  다운로드, 실행 권한 부여, 프로세스 실행, 예약 등록은 서로 다른 사건이다. 경로와 해시·명령·시간을 연결하고, cron 등록만으로 예약 작업이 실행됐다고 주장하지 않는다.

  진행: Red 공격 재현 → Blue 관측·대응 설계 → Purple 분석·인계. 제출은 미션당 한 칸이며, 총 100점입니다.
