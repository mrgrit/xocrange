      - 관측 또는 미션 조건에 맞게 범위를 한정한다. (8점)
      acceptable_methods:
      - 의미가 같으면 띄어쓰기·명령 옵션 순서·동등한 DQL 괄호·한국어 표현 차이를 허용한다. 단 대상, 시간 범위, 증거와 결론은 일치해야 한다.
      - '채점자 기준 답안: (crontab -l 2>/dev/null; printf ''%s\n'' ''# xoc-lf-h05 training marker'') | crontab -'
      - |-
        세부 배점과 부분 인정:
