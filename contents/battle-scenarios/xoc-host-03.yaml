briefing:
  story: 관리 명령 실행 후 새 계정이 보인다. Red는 실습 계정을 만들고 Blue는 실행 주체와 권한 사용을 감사 기록으로 확인한다.
  concept: 효과적인 사용자 root와 최초 로그인 주체(auid)는 다를 수 있다. 계정 변경은 실행자·명령·승인 내역과 연결해야 한다.
  entry: Red 2개 → Blue 3개 → Purple 2개를 순서대로 진행합니다.
  learner_level: 처음 로그를 읽는 학습자
  estimated_minutes: 60
runtime_contract:
  engine: tw2
  reference_commit: 324d91fb22fee2c76051d5e73b58aa7f82de3e4c
  purple_runtime_side: blue
  submission: text report for one mission; no multi-field form required by this content
  grading_path: semantic report endpoint; auto-monitor is contextual evidence only
