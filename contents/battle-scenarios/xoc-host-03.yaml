id: xoc-host-03
category: xoc-host-defense
title: sudo 사용과 계정 변경의 책임 추적
description: |-
  관리 명령 실행 후 새 계정이 보인다. Red는 실습 계정을 만들고 Blue는 실행 주체와 권한 사용을 감사 기록으로 확인한다.

  효과적인 사용자 root와 최초 로그인 주체(auid)는 다를 수 있다. 계정 변경은 실행자·명령·승인 내역과 연결해야 한다.

  진행: Red 공격 재현 → Blue 관측·대응 설계 → Purple 분석·인계. 제출은 미션당 한 칸이며, 총 100점입니다.
