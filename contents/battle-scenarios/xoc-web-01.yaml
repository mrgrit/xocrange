      - '채점자 기준 답안: 학습자 시도: 동일 사건의 요청·응답·로그를 시각·대상·표식으로 연결하고, 확인한 사실과 후속 조치 담당·검증 항목을 정리한다.

        시스템 반응: 해당 시도에 대응하는 실제 로그·응답·오류 또는 검색 결과와 시각·대상·출처를 제시한다. 결과 부재도 확인한 검색 범위와 수집 상태를 설명하면 인정한다. 미실행 대응안은 기존 관측만 제시하고
