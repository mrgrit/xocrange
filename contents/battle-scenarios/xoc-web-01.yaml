briefing:
  story: 쇼핑몰의 존재하지 않는 경로에 접근이 늘었다. 운영팀은 장애인지 탐색인지 구별하지 못한다. Red는 표식을 붙인 두 요청을 보내고 Blue는 같은 요청을 로그에서 찾아 조사 범위를 정한다.
  concept: URL과 User-Agent는 요청자가 지정하는 값이다. 수상한 문자열 하나만으로 침해를 확정하지 않고, 요청 시각·출발지·응답·거래 식별자로 같은 활동을 연결한다.
  entry: Red 2개 → Blue 3개 → Purple 2개를 순서대로 진행합니다.
  learner_level: 처음 로그를 읽는 학습자
  estimated_minutes: 60
