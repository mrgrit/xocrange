  reference_answer:
    answer: '학습자 시도: 동일 사건의 요청·응답·로그를 시각·대상·표식으로 연결하고, 판정 근거를 비교한다.

      시스템 반응: 해당 시도에 대응하는 실제 로그·응답·오류 또는 검색 결과와 시각·대상·출처를 제시한다. 결과 부재도 확인한 검색 범위와 수집 상태를 설명하면 인정한다. 미실행 대응안은 기존 관측만 제시하고 적용
      결과를 만들지 않는다.

      학습자의 해석: 경로 이탈 입력은 확인되지만 제공된 증거에는 파일 읽기 성공이 없다. 요청 파일값에 ../../etc/passwd가 있고 WAF 판정이 blocked다. 민감 파일 내용이 반환되었다는 자료는
      없다. 예시와 실측이 다르면 실측 근거에 따라 판정 범위와 다음 확인을 설명한다.'
