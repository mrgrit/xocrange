<ossec_config>
  <client><server><address>siem</address><port>1514</port><protocol>tcp</protocol></server><notify_time>10</notify_time><time-reconnect>5</time-reconnect><auto_restart>yes</auto_restart><enrollment><enabled>no</enabled></enrollment></client>
  <client_buffer><disabled>no</disabled><queue_size>5000</queue_size><events_per_second>500</events_per_second></client_buffer>
  <localfile><log_format>syslog</log_format><location>/var/log/xoc-agent-probe.log</location><only-future-events>no</only-future-events></localfile>
  <syscheck><disabled>no</disabled><frequency>10</frequency><scan_on_start>yes</scan_on_start><directories realtime="yes">/var/lib/xoc-probe</directories></syscheck>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
</ossec_config>
