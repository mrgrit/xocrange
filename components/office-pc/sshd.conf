# xOC office PC: password sign-in for the lab account, no root sign-in. Host keys are kept
# in the data volume so they survive an update.
HostKey /var/lib/xoc-office/ssh_host_ed25519_key
HostKey /var/lib/xoc-office/ssh_host_rsa_key
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
UsePAM yes
SyslogFacility AUTH
LogLevel INFO
