<ossec_config>
  <client>
    <server><address>10.20.32.100</address><port>1514</port><protocol>tcp</protocol></server>
    <notify_time>10</notify_time><time-reconnect>5</time-reconnect><auto_restart>yes</auto_restart>
    <enrollment><enabled>no</enabled></enrollment>
  </client>
  <client_buffer><disabled>no</disabled><queue_size>5000</queue_size><events_per_second>500</events_per_second></client_buffer>
  <localfile><log_format>syslog</log_format><location>/var/log/auth.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/syslog</location></localfile>
  <!-- Listening ports every six minutes (stock Wazuh agent check, rule 533 on a change). -->
  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>
    <alias>netstat listening ports</alias>
    <frequency>360</frequency>
  </localfile>
  <syscheck>
    <disabled>no</disabled><frequency>300</frequency><scan_on_start>yes</scan_on_start>
    <!-- Configuration, home directories and scheduled jobs: the alert carries what changed. -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc,/home,/var/spool/cron</directories>
    <directories realtime="yes" check_all="yes">/usr/bin,/usr/sbin</directories>
    <!-- Log files: creation, deletion, owner and permissions only (their content changes all the time). -->
    <directories realtime="yes" check_all="no" check_owner="yes" check_group="yes" check_perm="yes">/var/log</directories>
    <ignore>/etc/mtab</ignore><ignore>/etc/hosts</ignore><ignore>/etc/resolv.conf</ignore>
    <nodiff>/etc/shadow</nodiff><nodiff>/etc/gshadow</nodiff><nodiff type="sregex">ssh_host_.*_key$</nodiff><nodiff type="sregex">/\.ssh/id_</nodiff>
  </syscheck>
  <!-- The Manager may ask this PC to block an address for a while (firewall-drop). -->
  <active-response><disabled>no</disabled></active-response>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
</ossec_config>
