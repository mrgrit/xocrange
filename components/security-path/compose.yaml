services:
  fw:
    build:
      context: .
      dockerfile: fw/Dockerfile
    user: 0:0
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    security_opt:
    - no-new-privileges:true
    networks:
      ext:
        ipv4_address: 10.20.30.1
      pipe:
        ipv4_address: 10.20.31.1
    sysctls:
      net.ipv4.ip_forward: '1'
    restart: 'no'
    volumes:
    - fw-logs:/var/log/nftables
  ips:
    build:
      context: .
      dockerfile: ips/Dockerfile
    user: 0:0
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    - NET_RAW
    security_opt:
    - no-new-privileges:true
    networks:
      pipe:
        ipv4_address: 10.20.31.2
      dmz:
        ipv4_address: 10.20.32.1
    sysctls:
      net.ipv4.ip_forward: '1'
    restart: 'no'
    tmpfs:
    - /run:size=8m,mode=0755
    - /tmp:size=16m,mode=1777
    depends_on:
    - fw
    volumes:
    - ips-logs:/var/log/suricata
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    user: 0:0
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    - SETUID
    - SETGID
    security_opt:
    - no-new-privileges:true
    networks:
      dmz:
        ipv4_address: 10.20.32.80
      int:
        ipv4_address: 10.20.40.80
    sysctls:
      net.ipv4.ip_forward: '0'
    restart: 'no'
    tmpfs:
    - /tmp:size=16m,mode=1777
    - /run/apache2:size=8m,mode=0755,uid=33,gid=33
    - /var/lib/modsecurity:size=8m,mode=0755,uid=33,gid=33
    depends_on:
    - ips
    environment:
      XOC_WEB_TARGETS: '[]'
    volumes:
    - web-logs:/var/log/apache2
networks:
  int:
    internal: true
  ext:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
      - subnet: 10.20.30.0/24
        gateway: 10.20.30.254
  pipe:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
      - subnet: 10.20.31.0/24
        gateway: 10.20.31.254
  dmz:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
      - subnet: 10.20.32.0/24
        gateway: 10.20.32.254
volumes:
  fw-logs: {}
  ips-logs: {}
  web-logs: {}
