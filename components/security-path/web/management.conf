# Common HTTPS management vhost; TLS ends at the reviewed ingress.
Listen 8443
<VirtualHost *:8443>
    ServerName core.xoc.test
    # TLS terminates at ingress before HTTP enters fw/IPS. Only ingress may
    # reach this listener; its dedicated source header replaces client input.
    RemoteIPHeader X-Xoc-Client-IP
    RemoteIPInternalProxy 172.29.10.20
    RequestHeader unset X-Xoc-Client-IP
    # Preserve the backend DNS name for SNI and certificate hostname validation.
    ProxyPreserveHost Off
    SSLProxyEngine On
    SSLProxyVerify require
    SSLProxyVerifyDepth 1
    SSLProxyCheckPeerName On
    SSLProxyCACertificateFile /run/xoc-tls/ca.pem
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset X-Forwarded-Port
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    RedirectMatch 302 ^/$ /core/
    RedirectMatch 308 ^/siem$ /siem/
    Alias /assets/xoc-range-logo.png /run/xoc-tls/logo.png
    Alias /ca.crt /run/xoc-tls/ca.pem
    <Directory /run/xoc-tls>
        Require all denied
        <FilesMatch "^(logo\.png|ca\.pem)$">
            Require all granted
        </FilesMatch>
    </Directory>

    RedirectMatch 308 ^/core$ /core/
    ProxyPass /core/ unix:/run/xoc-platform-socket/api.sock|http://platform/core/ connectiontimeout=5 timeout=30
    ProxyPassReverse /core/ http://platform/core/
    <Location /core/>
        Require all granted
    </Location>
    # Credentials remain application inputs but never audit-body/header evidence.
    # Only password fields on the exact authentication/account routes skip CRS.
    SecRule REQUEST_URI "@rx ^/core(?:/|$)" "id:110094,phase:1,pass,nolog,t:none,ctl:auditLogParts=AHZ,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Host-xoc_session,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Host-xoc_csrf"
    SecRule REQUEST_URI "@rx ^/core/api/(?:login|password|users)$" "id:110095,phase:1,pass,nolog,t:none,chain"
        SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json(?:\s*;|$)" "t:none,t:lowercase,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:current_password"
    Include /run/xoc-tls/host-rule.conf
    Include /run/apache2/xoc-siem-route.conf
</VirtualHost>
