# Loaded only when the SIEM UI component and its per-install TLS volume exist.
Listen 8443
<VirtualHost *:8443>
    ServerName core.xoc.test
    # TLS terminates at ingress before HTTP enters fw/IPS. Only ingress may
    # reach this listener; its dedicated source header replaces client input.
    RemoteIPHeader X-Xoc-Client-IP
    RemoteIPInternalProxy 172.29.10.20
    RequestHeader unset X-Xoc-Client-IP
    # Preserve the backend DNS name for SNI and certificate hostname validation.
    ProxyPreserveHost Off
    SSLProxyEngine On
    SSLProxyVerify require
    SSLProxyVerifyDepth 1
    SSLProxyCheckPeerName On
    SSLProxyCACertificateFile /run/xoc-tls/ca.pem
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset X-Forwarded-Port
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    RedirectMatch 302 ^/$ /siem/
    RedirectMatch 308 ^/siem$ /siem/
    Alias /assets/xoc-range-logo.png /run/xoc-tls/logo.png
    Alias /ca.crt /run/xoc-tls/ca.pem
    <Directory /run/xoc-tls>
        Require all denied
        <FilesMatch "^(logo\.png|ca\.pem)$">
            Require all granted
        </FilesMatch>
    </Directory>

    # Keep /siem intact: Dashboard owns basePath redirects and session-cookie paths.
    ProxyPass /siem/ https://dashboard:5601/siem/ connectiontimeout=5 timeout=120 upgrade=websocket
    ProxyPassReverse /siem/ https://dashboard:5601/siem/
    <Location /siem/>
        Require all granted
    </Location>
    Include /run/xoc-tls/host-rule.conf

    # Discover uses this value to highlight the complete field. Only this field,
    # JSON POST and these exact search endpoints are excluded from CRS 942220.
    SecRule REQUEST_URI "@rx ^/siem/internal/search/(?:opensearch|opensearch-with-long-numerals)(?:\?|$)" "id:110090,phase:1,pass,nolog,t:none,chain"
        SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json(?:\s*;|$)" "t:none,t:lowercase,ctl:ruleRemoveTargetById=942220;ARGS:params.body.highlight.fragment_size"

    # Index-pattern definitions contain log field names such as .profile. Do not
    # exempt other fields, methods, endpoints or the training-target vhosts.
    SecRule REQUEST_URI "@rx ^/siem/api/saved_objects/index-pattern/[^/?]+(?:\?|$)" "id:110091,phase:1,pass,nolog,t:none,chain"
        SecRule REQUEST_METHOD "@streq PUT" "t:none,chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json(?:\s*;|$)" "t:none,t:lowercase,ctl:ruleRemoveById=911100,ctl:ruleRemoveTargetById=930120;ARGS:attributes.fields,ctl:ruleRemoveTargetById=941160;ARGS:attributes.fields,ctl:ruleRemoveTargetById=942190;ARGS:attributes.fields"
    # Saved-object editing/deletion is part of the authenticated Dashboard API.
    SecRule REQUEST_URI "@rx ^/siem/api/saved_objects/(?:index-pattern|search|visualization|dashboard|config)/[^/?]+(?:\?|$)" "id:110092,phase:1,pass,nolog,t:none,chain"
        SecRule REQUEST_METHOD "@rx ^(?:PUT|DELETE)$" "t:none,ctl:ruleRemoveById=911100"
    # Quoted file-path searches are SIEM evidence lookups, not OS file reads.
    # Match only the three C1 path fields in known Discover/filter query shapes.
    SecRule REQUEST_URI "@rx ^/siem/internal/search/(?:opensearch|opensearch-with-long-numerals)(?:\?|$)" "id:110093,phase:1,pass,nolog,t:none,chain"
        SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json(?:\s*;|$)" "t:none,t:lowercase,ctl:ruleRemoveTargetById=930120;ARGS:params.body.query.bool.filter.filter.bool.should.should.match_phrase.process.executable,ctl:ruleRemoveTargetById=930120;ARGS:params.body.query.bool.filter.filter.bool.should.should.match_phrase.file.path,ctl:ruleRemoveTargetById=930120;ARGS:params.body.query.bool.filter.filter.bool.should.should.match_phrase.osquery.columns.path,ctl:ruleRemoveTargetById=930120;ARGS:params.body.query.bool.filter.filter.match_phrase.process.executable,ctl:ruleRemoveTargetById=930120;ARGS:params.body.query.bool.filter.filter.match_phrase.file.path,ctl:ruleRemoveTargetById=930120;ARGS:params.body.query.bool.filter.filter.match_phrase.osquery.columns.path,ctl:ruleRemoveTargetById=930120;ARGS:params.body.query.match_phrase.process.executable,ctl:ruleRemoveTargetById=930120;ARGS:params.body.query.match_phrase.file.path,ctl:ruleRemoveTargetById=930120;ARGS:params.body.query.match_phrase.osquery.columns.path"
</VirtualHost>
