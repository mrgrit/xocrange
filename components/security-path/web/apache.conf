ServerName core.xoc.test
ServerTokens Prod
ServerSignature Off
ProxyRequests Off
ProxyTimeout 5
RequestHeader unset X-Forwarded-For early
RequestHeader unset X-Forwarded-Host early
LogFormat "%a - - %t \"%r\" %>s %B xoc_id=%{UNIQUE_ID}e" xoc_native
SetEnvIf Request_URI "^/core(?:/|$)" xoc_management_request
LogFormat "%a - - %t \"%m %U %H\" %>s %B xoc_id=%{UNIQUE_ID}e" xoc_management
CustomLog /var/log/apache2/access.log xoc_native env=!xoc_management_request
CustomLog /var/log/apache2/access.log xoc_management env=xoc_management_request
ErrorLog /var/log/apache2/error.log
Header always set X-Xoc-Request-Id "%{UNIQUE_ID}e"
IncludeOptional /run/apache2/xoc-sites.conf
