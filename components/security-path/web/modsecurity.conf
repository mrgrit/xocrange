SecRuleEngine On
SecRequestBodyAccess On
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:[a-z0-9.+-]+\+)?json(?:\s*;|$)" "id:1000010,phase:1,pass,nolog,t:none,t:lowercase,ctl:requestBodyProcessor=JSON"
SecRule REQBODY_ERROR "!@eq 0" "id:1000011,phase:2,deny,status:400,log,msg:'Malformed request body'"
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecTmpDir /var/lib/modsecurity
SecDataDir /var/lib/modsecurity
SecAuditEngine On
SecAuditLogType Serial
SecAuditLogFormat JSON
# Transaction metadata and rule evidence only; no body/header capture.
SecAuditLogParts AHZ
SecAuditLog /var/log/apache2/modsec_audit.json
SecRule REQUEST_HEADERS:X-Xoc-Probe "@streq waf-block" "id:1000002,phase:1,deny,status:403,log,msg:'xOC WAF verification marker'"

# Parsed JSON checks must run in phase 2 BEFORE the CRS phase-2 rules. Only
# native Wazuh rule/decoder XML in the authenticated editor receives exclusions.
# The training vhosts listen on 8080 and cannot enter this exception.
SecRule SERVER_PORT "@eq 8443" "id:110096,phase:2,pass,nolog,t:none,chain"
    SecRule REQUEST_URI "@streq /siem/api/request" "t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json(?:\s*;|$)" "t:none,t:lowercase,chain"
    SecRule ARGS:method "@streq PUT" "t:none,chain"
    SecRule ARGS:path "@rx ^/(?:rules|decoders)/files/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,127}\.xml$" "t:none,chain"
    SecRule ARGS:body.origin "@streq raw" "t:none,chain"
    SecRule ARGS:body.params.relative_dirname "@rx ^etc/(?:rules|decoders)$" "t:none,ctl:ruleRemoveTargetById=930120;ARGS:body.body,ctl:ruleRemoveTargetById=932160;ARGS:body.body,ctl:ruleRemoveTargetById=941100;ARGS:body.body,ctl:ruleRemoveTargetById=941110;ARGS:body.body,ctl:ruleRemoveTargetById=941160;ARGS:body.body"

# Only literal detection patterns in the Core rule preview may contain attack syntax.
# Observed CRS IDs remain active for names, addresses, other fields and all other routes.
SecRule SERVER_PORT "@eq 8443" "id:110097,phase:2,pass,nolog,t:none,chain"
    SecRule REQUEST_URI "@streq /core/api/console/waf/preview" "t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json(?:\s*;|$)" "t:none,t:lowercase,chain"
    SecRule ARGS:payload.operation "@streq upsert" "t:none,ctl:ruleRemoveTargetById=930100;ARGS:payload.fields.pattern,ctl:ruleRemoveTargetById=930110;ARGS:payload.fields.pattern,ctl:ruleRemoveTargetById=930120;ARGS:payload.fields.pattern,ctl:ruleRemoveTargetById=932100;ARGS:payload.fields.pattern,ctl:ruleRemoveTargetById=932160;ARGS:payload.fields.pattern,ctl:ruleRemoveTargetById=941100;ARGS:payload.fields.pattern,ctl:ruleRemoveTargetById=941110;ARGS:payload.fields.pattern,ctl:ruleRemoveTargetById=941160;ARGS:payload.fields.pattern,ctl:ruleRemoveTargetById=942100;ARGS:payload.fields.pattern,ctl:ruleRemoveTargetById=942190;ARGS:payload.fields.pattern,ctl:ruleRemoveTargetById=942270;ARGS:payload.fields.pattern"
SecRule SERVER_PORT "@eq 8443" "id:110098,phase:2,pass,nolog,t:none,chain"
    SecRule REQUEST_URI "@streq /core/api/console/ips/preview" "t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json(?:\s*;|$)" "t:none,t:lowercase,chain"
    SecRule ARGS:payload.operation "@streq upsert" "t:none,ctl:ruleRemoveTargetById=930100;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=930100;ARGS:payload.fields.pcre,ctl:ruleRemoveTargetById=930110;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=930110;ARGS:payload.fields.pcre,ctl:ruleRemoveTargetById=930120;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=930120;ARGS:payload.fields.pcre,ctl:ruleRemoveTargetById=932100;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=932100;ARGS:payload.fields.pcre,ctl:ruleRemoveTargetById=932160;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=932160;ARGS:payload.fields.pcre,ctl:ruleRemoveTargetById=941100;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=941100;ARGS:payload.fields.pcre,ctl:ruleRemoveTargetById=941110;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=941110;ARGS:payload.fields.pcre,ctl:ruleRemoveTargetById=941160;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=941160;ARGS:payload.fields.pcre,ctl:ruleRemoveTargetById=942100;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=942100;ARGS:payload.fields.pcre,ctl:ruleRemoveTargetById=942190;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=942190;ARGS:payload.fields.pcre,ctl:ruleRemoveTargetById=942270;ARGS:payload.fields.content,ctl:ruleRemoveTargetById=942270;ARGS:payload.fields.pcre"
