SecRuleEngine On
SecRequestBodyAccess On
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:[a-z0-9.+-]+\+)?json(?:\s*;|$)" "id:1000010,phase:1,pass,nolog,t:none,t:lowercase,ctl:requestBodyProcessor=JSON"
SecRule REQBODY_ERROR "!@eq 0" "id:1000011,phase:2,deny,status:400,log,msg:'Malformed request body'"
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecTmpDir /var/lib/modsecurity
SecDataDir /var/lib/modsecurity
SecAuditEngine On
SecAuditLogType Serial
SecAuditLogFormat JSON
# Transaction metadata and rule evidence only; no body/header capture.
SecAuditLogParts AHZ
SecAuditLog /var/log/apache2/modsec_audit.json
SecRule REQUEST_HEADERS:X-Xoc-Probe "@streq waf-block" "id:1000002,phase:1,deny,status:403,log,msg:'xOC WAF verification marker'"
