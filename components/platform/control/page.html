<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xOC Range Core</title><link rel="stylesheet" href="/core/assets/style.css"><script src="/core/assets/app.js" defer></script></head><body><main><header><img src="/assets/xoc-range-logo.png" alt="xOC Range"><h1>Core 관리</h1></header><p id="notice" role="status"></p><section id="login"><h2>로그인</h2><form id="login-form"><label>계정<input name="username" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section><section id="account" hidden><p id="identity"></p><button id="logout">로그아웃</button><details id="password-panel"><summary>비밀번호 변경</summary><form id="password-form"><label>현재 비밀번호<input name="current_password" type="password" autocomplete="current-password" required></label><label>새 비밀번호 · 14자 이상<input name="password" type="password" autocomplete="new-password" minlength="14" maxlength="128" required></label><button>변경</button></form></details><section id="devices"><h2>장비 쓰기 권한</h2><p>FW · IPS · WAF의 변경 허용 여부를 관리합니다. 장비 설정 콘솔은 다음 구축 단계에서 연결됩니다.</p><ul id="device-list"></ul></section><section id="admin" hidden><h2>계정 관리</h2><form id="user-form"><label>계정<input name="username" pattern="[a-z][a-z0-9_-]{2,31}" required></label><label>역할<select name="role"><option value="viewer">조회자</option><option value="operator">운영자</option><option value="admin">관리자</option></select></label><label>초기 비밀번호<input name="password" type="password" minlength="14" autocomplete="new-password" required></label><button>계정 추가 / 갱신</button></form><pre id="users"></pre><h2>최근 감사 기록</h2><pre id="audit"></pre></section><a href="/siem/" id="siem-link">SIEM 열기 · 별도 Wazuh 계정</a></section></main></body></html>
