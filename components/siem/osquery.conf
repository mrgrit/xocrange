{
  "options": {
    "disable_events": "true",
    "disable_audit": "true",
    "logger_path": "/var/log/xocrange/osquery",
    "logger_rotate": "true",
    "logger_rotate_size": "8388608",
    "logger_rotate_max_files": "3"
  },
  "schedule": {
    "core_processes": {
      "query": "SELECT pid,parent,name,path,uid,gid FROM processes;",
      "interval": 60
    },
    "core_sensor": {
      "query": "SELECT pid,version FROM osquery_info;",
      "interval": 30,
      "snapshot": true
    }
  }
}
