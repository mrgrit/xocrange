<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <rotate_interval>1h</rotate_interval>
    <max_output_size>10M</max_output_size>
  </global>
  <alerts><log_alert_level>1</log_alert_level></alerts>
  <remote><connection>secure</connection><port>1514</port><protocol>tcp</protocol><queue_size>131072</queue_size></remote>
  <auth><disabled>yes</disabled></auth>
  <syscheck><disabled>no</disabled><frequency>43200</frequency><directories>/etc</directories></syscheck>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>no</disabled><interval>1h</interval><scan_on_start>yes</scan_on_start><hardware>yes</hardware><os>yes</os><network>yes</network><packages>yes</packages><ports all="yes">yes</ports><processes>yes</processes></wodle>
  <vulnerability-detection><enabled>no</enabled></vulnerability-detection>
  <indexer><enabled>no</enabled></indexer>
  <ruleset>
    <decoder_dir>etc/xoc-decoders</decoder_dir>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <rule_dir>etc/xoc-rules</rule_dir>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>
</ossec_config>
