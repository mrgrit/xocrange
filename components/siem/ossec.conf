<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <rotate_interval>1h</rotate_interval>
    <max_output_size>10M</max_output_size>
  </global>
  <alerts><log_alert_level>1</log_alert_level></alerts>
  <ruleset>
    <decoder_dir>etc/xoc-decoders</decoder_dir>
    <rule_dir>etc/xoc-rules</rule_dir>
  </ruleset>
</ossec_config>
