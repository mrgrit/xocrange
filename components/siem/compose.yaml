services:
  siem:
    build: {context: ., dockerfile: Dockerfile}
    hostname: xoc-manager
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETUID, SETGID, SYS_CHROOT]
    security_opt: [no-new-privileges:true]
    # The dmz address is where agents on the office network reach the agent port (1514)
    # through the IPS (ADR 0012); the IPS forwards nothing else to it.
    networks:
      int: {}
      dmz:
        ipv4_address: 10.20.32.100
    restart: 'no'
    tmpfs:
    - /run:size=16m,mode=0755
    - /var/ossec/var/run:size=16m,mode=0750,uid=999,gid=999
    - /var/ossec/tmp:size=32m,mode=0770,uid=999,gid=999
    - /tmp:size=16m,mode=1777
    volumes:
    - siem-logs:/var/ossec/logs
    - siem-etc:/var/ossec/etc
    - siem-api:/var/ossec/api/configuration
    - siem-queue:/var/ossec/queue
    - siem-var:/var/ossec/var
    - siem-config:/run/xoc-manager:ro
networks:
  int: {internal: true}
  dmz:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    ipam:
      config:
      - subnet: 10.20.32.0/24
        gateway: 10.20.32.254
volumes:
  siem-logs: {}
  siem-etc: {}
  siem-api: {}
  siem-queue: {}
  siem-var: {}
  siem-config: {}
