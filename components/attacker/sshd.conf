# xOC attack terminal: password sign-in for the lab account, no root sign-in. Host keys are
# kept in the data volume so they survive an update.
HostKey /var/lib/xoc-attacker/ssh_host_ed25519_key
HostKey /var/lib/xoc-attacker/ssh_host_rsa_key
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
UsePAM yes
